{{define "users"}}{{template "head" .}}
<section class="panel">
  <h2>新建用户</h2>
  <form method="post" action="/users/create" class="grid-form">
    {{template "csrf" .}}
    <label>用户名<input name="name" required></label>
    <label>显示名<input name="display_name"></label>
    <label>邮箱<input name="email" type="email"></label>
    <label>头像 URL<input name="picture_url"></label>
    <button class="primary" type="submit">创建</button>
  </form>
</section>
<section class="panel">
  <h2>用户列表 <span class="muted">{{len .Data.Users}} 个</span></h2>
  {{if .Data.Users}}<div class="table-wrap"><table>
    <tr><th>ID</th><th>用户名</th><th>创建时间</th><th>操作</th></tr>
    {{range .Data.Users}}<tr>
      <td>{{.ID}}</td><td><b>{{.Name}}</b></td><td>{{tf .CreatedAt}}</td>
      <td class="ops">
        <form method="post" action="/users/rename" onsubmit="return confirm('重命名用户？')">{{template "csrf" $}}<input type="hidden" name="id" value="{{.ID}}"><input name="new_name" value="{{.Name}}" required><button>重命名</button></form>
        <form method="post" action="/users/delete" onsubmit="return confirm('删除用户 {{.Name}}？该用户下的节点需要重新分配。')">{{template "csrf" $}}<input type="hidden" name="id" value="{{.ID}}"><button class="danger">删除</button></form>
      </td>
    </tr>{{end}}
  </table></div>{{else}}<p class="empty">暂无用户。</p>{{end}}
</section>
{{template "foot" .}}{{end}}
